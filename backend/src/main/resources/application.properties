# Server Configuration
server.port=8080

# Application Name
spring.application.name=opd-backend

# ==============================================================
# MySQL Cloud Database Configuration (Aiven Cloud MySQL)
# Host: mysql-3c4d67bc-maghudiyapiyush5952-7beb.l.aivencloud.com
# Port: 26314
# Database: defaultdb
# Username: avnadmin
# SSL Mode: REQUIRED
# ==============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-3c4d67bc-maghudiyapiyush5952-7beb.l.aivencloud.com:26314/defaultdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:YOUR_DATABASE_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration
# Automatically creates/updates the tables (patients, appointments, consultations) in defaultdb
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Application Timezone (Used to calculate today's appointments accurately)
app.timezone=Asia/Kolkata

# Jackson JSON Date Formatting
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata
